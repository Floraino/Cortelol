[package]
name = "cortelol-download-broker-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "mod.rs"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
